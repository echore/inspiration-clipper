<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title data-i18n="extName"></title>
	<style>
		/* 暖石色中性底 + 单一深蓝强调;绿/红只留给连接结果。圆角体系:卡 14 / 控件 9。 */
		:root {
			--bg: #f6f5f2;
			--card: #ffffff;
			--ink: #1c1917;
			--muted: #78716c;
			--line: #e7e5e4;
			--accent: #2563eb;
			--accent-down: #1d4ed8;
			--accent-soft: #eff4ff;
			--ok: #16a34a;
			--bad: #dc2626;
			--r-card: 14px;
			--r-ctl: 9px;
		}
		* { box-sizing: border-box; }
		body {
			font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
			background: var(--bg);
			max-width: 600px;
			margin: 0 auto;
			padding: 40px 24px 64px;
			line-height: 1.7;
			color: var(--ink);
		}
		.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
		.brand img { width: 36px; height: 36px; border-radius: 9px; }
		.brand h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
		.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 30px; margin-bottom: 10px; }
		.back-link {
			border: 0; background: none; padding: 4px 8px 4px 0; cursor: pointer;
			font-size: 14px; color: var(--muted); border-radius: var(--r-ctl);
		}
		.back-link:hover { color: var(--ink); }
		.progress { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
		.progress .dot {
			width: 7px; height: 7px; border-radius: 50%;
			background: var(--line); display: inline-block;
		}
		.progress .dot.on { background: var(--accent); }
		section[data-step] {
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: var(--r-card);
			padding: 26px 28px 24px;
			box-shadow: 0 1px 2px rgba(28, 25, 23, 0.05), 0 10px 30px rgba(28, 25, 23, 0.05);
		}
		@media (prefers-reduced-motion: no-preference) {
			section[data-step]:not([hidden]) { animation: rise 0.22s ease; }
			@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
		}
		h2 { font-size: 17px; margin: 0 0 6px; letter-spacing: -0.01em; }
		[hidden] { display: none !important; }
		.intro { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
		ol.guide { font-size: 14px; padding-left: 0; margin: 14px 0; list-style: none; counter-reset: step; }
		ol.guide li {
			margin: 10px 0; padding-left: 34px; position: relative; counter-increment: step;
		}
		ol.guide li::before {
			content: counter(step);
			position: absolute; left: 0; top: 3px;
			width: 22px; height: 22px; border-radius: 50%;
			background: var(--accent-soft); color: var(--accent);
			font-size: 12px; font-weight: 600;
			display: flex; align-items: center; justify-content: center;
		}
		.card-choice {
			display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
			border: 1.5px solid var(--line); border-radius: var(--r-card); background: var(--card);
			padding: 16px 18px; margin: 12px 0; cursor: pointer; font-size: 15px;
			font-family: inherit; color: inherit;
			transition: border-color 0.15s ease, background 0.15s ease;
		}
		.card-choice:hover { border-color: var(--accent); background: var(--accent-soft); }
		.card-choice:active { transform: scale(0.99); }
		.card-choice .badge {
			flex: none; width: 40px; height: 40px; border-radius: 10px;
			display: flex; align-items: center; justify-content: center;
			color: #fff; font-size: 18px; font-weight: 700;
		}
		.badge-obsidian { background: #7c3aed; }
		.badge-notion { background: #18181b; }
		.card-choice .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
		label { display: block; margin-top: 14px; font-size: 14px; font-weight: 550; }
		input {
			width: 100%; padding: 9px 11px; margin-top: 5px;
			border: 1.5px solid var(--line); border-radius: var(--r-ctl);
			font-size: 14px; background: #fcfcfb; color: var(--ink);
		}
		input:focus-visible { outline: none; border-color: var(--accent); background: #fff; }
		input[type="password"] { font-family: ui-monospace, monospace; font-size: 13px; }
		details { margin-top: 14px; font-size: 14px; }
		details summary { cursor: pointer; color: var(--muted); }
		.btn {
			padding: 9px 18px; border: 0; border-radius: var(--r-ctl);
			font-size: 14px; font-weight: 550; cursor: pointer;
			font-family: inherit; background: #efedea; color: var(--ink);
		}
		.btn:active { transform: translateY(1px); }
		.btn.primary { background: var(--accent); color: #fff; }
		.btn.primary:hover { background: var(--accent-down); }
		.btn.primary:disabled { background: #b9cdf5; cursor: not-allowed; transform: none; }
		.btn.finish { background: var(--ok); color: #fff; }
		.btn.finish:disabled { background: #a9d8ba; cursor: not-allowed; transform: none; }
		a.btn { display: inline-block; text-decoration: none; }
		.linklike {
			border: 0; background: none; padding: 0; cursor: pointer;
			font-size: 13px; color: var(--muted); text-decoration: underline; font-family: inherit;
			margin-top: 10px;
		}
		.linklike:hover { color: var(--ink); }
		.nav { display: flex; justify-content: flex-end; margin-top: 26px; }
		.inline-status { font-size: 13px; margin-top: 10px; min-height: 18px; color: var(--muted); }
		.inline-status.ok { color: var(--ok); }
		.inline-status.bad { color: var(--bad); }
		.page-list { margin-top: 8px; }
		.page-item {
			display: block; width: 100%; text-align: left;
			border: 1.5px solid var(--line); border-radius: var(--r-ctl); background: var(--card);
			padding: 9px 13px; margin: 7px 0; cursor: pointer; font-size: 14px;
			font-family: inherit; color: inherit;
		}
		.page-item:hover { border-color: var(--accent); }
		.page-item.selected { border-color: var(--accent); background: var(--accent-soft); }
		.status-light {
			display: inline-block; width: 10px; height: 10px; border-radius: 50%;
			margin-right: 7px; background: var(--line);
		}
		.status-light.ok { background: var(--ok); }
		.status-light.bad { background: var(--bad); }
		.muted { color: var(--muted); font-size: 13px; }
		.overview-card p { margin: 8px 0; }
		.done-list { font-size: 15px; padding-left: 20px; margin: 14px 0; }
		.done-list li { margin: 10px 0; }
		.usage-hint { margin-top: 18px; color: var(--muted); font-size: 13px; }
		kbd {
			font-family: ui-monospace, monospace; font-size: 12px;
			background: #efedea; border: 1px solid var(--line); border-bottom-width: 2px;
			border-radius: 5px; padding: 1px 6px;
		}
	</style>
</head>
<body>
	<header class="brand">
		<img src="../icon128.png" alt="">
		<h1 data-i18n="extName"></h1>
	</header>
	<div class="topbar">
		<button type="button" class="back-link" id="back-link" hidden></button>
		<span class="progress" id="progress"></span>
	</div>

	<!-- 总览态 -->
	<section data-step="overview" hidden>
		<h2 data-i18n="ovTitle"></h2>
		<div class="overview-card">
			<p id="ov-dest"></p>
			<p><span id="ov-light" class="status-light"></span><span id="ov-status" class="muted"></span></p>
			<p id="ov-detail" class="muted"></p>
			<p><a id="ov-db-link" href="#" target="_blank" data-i18n="ovOpenDb" hidden></a></p>
			<div class="nav" style="justify-content: space-between;">
				<button type="button" class="btn" id="ov-switch" data-i18n="ovSwitchDest"></button>
				<button type="button" class="btn primary" id="ov-reconfigure" data-i18n="ovReconfigure"></button>
			</div>
		</div>
		<p class="usage-hint" data-i18n="ovUsage"></p>
	</section>

	<!-- 第 1 步:选目的地 -->
	<section data-step="choose" hidden>
		<h2 data-i18n="wizChooseTitle"></h2>
		<button type="button" class="card-choice" data-choose="obsidian">
			<span class="badge badge-obsidian">O</span>
			<span>
				<strong data-i18n="dest_obsidian"></strong>
				<span class="sub" data-i18n="wizChooseObsidian"></span>
			</span>
		</button>
		<button type="button" class="card-choice" data-choose="notion">
			<span class="badge badge-notion">N</span>
			<span>
				<strong data-i18n="dest_notion"></strong>
				<span class="sub" data-i18n="wizChooseNotion"></span>
			</span>
		</button>
	</section>

	<!-- Obsidian O1:装插件 -->
	<section data-step="obsidian-install" hidden>
		<h2 data-i18n="wizObInstallTitle"></h2>
		<p class="intro" data-i18n="wizObInstallIntro"></p>
		<ol class="guide">
			<li data-i18n="wizObInstallStep1"></li>
			<li data-i18n="wizObInstallStep2"></li>
			<li data-i18n="wizObInstallStep3"></li>
		</ol>
		<a class="btn primary"
			href="https://github.com/echore/obsidian-media-companion/releases/latest"
			target="_blank" data-i18n="wizObInstallDownload"></a>
		<div class="nav">
			<button type="button" class="btn primary" data-nav="next" data-i18n="wizObInstallDone"></button>
		</div>
	</section>

	<!-- Obsidian O2:开 API、粘 key、测试 -->
	<section data-step="obsidian-connect" hidden>
		<h2 data-i18n="wizObConnectTitle"></h2>
		<ol class="guide">
			<li data-i18n="wizObConnectStep1"></li>
			<li data-i18n="wizObConnectStep2"></li>
			<li data-i18n="wizObConnectStep3"></li>
		</ol>
		<label for="apiKey" data-i18n="wizObKeyLabel"></label>
		<input id="apiKey" type="password" autocomplete="off">
		<details>
			<summary data-i18n="wizObAdvanced"></summary>
			<label for="port" data-i18n="optPort"></label>
			<input id="port" type="number" min="0" max="65535" value="27124">
		</details>
		<p class="muted" style="margin-top:12px" data-i18n="wizObTestHint"></p>
		<button type="button" class="btn" id="ob-test" data-i18n="optTestConnection"></button>
		<div class="inline-status" id="ob-test-status"></div>
		<div class="nav">
			<button type="button" class="btn primary" id="ob-next" data-nav="next" data-i18n="wizNext" disabled></button>
		</div>
	</section>

	<!-- Obsidian O3:文件夹 + 完成 -->
	<section data-step="obsidian-folder" hidden>
		<h2 data-i18n="wizObFolderTitle"></h2>
		<p class="intro" data-i18n="wizObFolderHint"></p>
		<label for="folder" data-i18n="optFolder"></label>
		<input id="folder" type="text" value="灵感库">
		<div class="nav">
			<button type="button" class="btn finish" id="ob-finish" data-i18n="wizFinish"></button>
		</div>
	</section>

	<!-- Notion N1:token -->
	<section data-step="notion-token" hidden>
		<h2 data-i18n="wizNoTokenTitle"></h2>
		<p class="intro" data-i18n="wizNoTokenIntro"></p>
		<ol class="guide">
			<li data-i18n="wizNoTokenStep1"></li>
			<li data-i18n="wizNoTokenStep2"></li>
			<li data-i18n="wizNoTokenStep3"></li>
		</ol>
		<a class="btn primary" href="https://www.notion.so/my-integrations" target="_blank" data-i18n="wizNoTokenOpen"></a>
		<label for="token" data-i18n="wizNoTokenLabel"></label>
		<input id="token" type="password" autocomplete="off">
		<button type="button" class="btn" id="no-verify" style="margin-top:12px" data-i18n="wizNoTokenVerify"></button>
		<div class="inline-status" id="no-verify-status"></div>
		<div class="nav">
			<button type="button" class="btn primary" id="no-token-next" data-nav="next" data-i18n="wizNext" disabled></button>
		</div>
	</section>

	<!-- Notion N2:连接页面,自动检测 -->
	<section data-step="notion-page" hidden>
		<h2 data-i18n="wizNoPageTitle"></h2>
		<p class="intro" data-i18n="wizNoPageIntro"></p>
		<ol class="guide">
			<li data-i18n="wizNoPageStep1"></li>
			<li data-i18n="wizNoPageStep2"></li>
			<li data-i18n="wizNoPageStep3"></li>
		</ol>
		<div class="inline-status" id="no-detect-status"></div>
		<div class="page-list" id="page-list"></div>
		<button type="button" class="linklike" id="no-refresh" data-i18n="wizNoPageRefresh"></button>
		<div class="nav">
			<button type="button" class="btn primary" id="no-page-next" data-nav="next" data-i18n="wizNext" disabled></button>
		</div>
	</section>

	<!-- Notion N3:建库 + 完成 -->
	<section data-step="notion-database" hidden>
		<h2 data-i18n="wizNoDbTitle"></h2>
		<p class="intro" data-i18n="wizNoDbIntro"></p>
		<button type="button" class="btn primary" id="no-create-db" data-i18n="wizNoDbCreate"></button>
		<div class="inline-status" id="no-db-status"></div>
		<div class="nav">
			<button type="button" class="btn finish" id="no-finish" data-i18n="wizFinish" disabled></button>
		</div>
	</section>

	<!-- 完成页 -->
	<section data-step="done" hidden>
		<h2 data-i18n="wizDoneTitle"></h2>
		<ul class="done-list">
			<li data-i18n="wizDoneShortcut"></li>
			<li data-i18n="wizDoneContext"></li>
			<li data-i18n="wizDonePopup"></li>
		</ul>
		<p class="intro" data-i18n="wizDoneTry"></p>
		<div class="nav">
			<button type="button" class="btn primary" id="done-overview" data-i18n="ovTitle"></button>
		</div>
	</section>

	<script type="module" src="options.js"></script>
</body>
</html>
